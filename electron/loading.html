<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILGC — Starting…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }

    .card {
      width: 100%; height: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 36px 48px;
    }

    .icon-wrap {
      width: 64px; height: 64px;
      background: hsl(210 100% 50% / .1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-wrap svg { width: 32px; height: 32px; }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      letter-spacing: -.3px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid hsl(210 100% 50% / .15);
      border-top-color: hsl(210 100% 50%);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-track {
      width: 100%;
      height: 4px;
      background: #f0f0f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: hsl(210 100% 50%);
      border-radius: 99px;
      transition: width .4s ease;
    }

    .status {
      font-size: 13px;
      color: #666;
      text-align: center;
      min-height: 18px;
      max-width: 380px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .btn {
      display: none;
      padding: 7px 20px;
      font-size: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn.visible { display: inline-block; }

    .quit-btn {
      color: #fff;
      background: #e53e3e;
    }
    .quit-btn:hover { background: #c53030; }

    .debug-btn {
      color: #fff;
      background: #3b82f6;
    }
    .debug-btn:hover { background: #2563eb; }

    /* Always-visible small debug link */
    .debug-link {
      font-size: 11px;
      color: #bbb;
      text-decoration: underline;
      cursor: pointer;
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      padding: 0;
    }
    .debug-link:hover { color: #888; }

    .spinner.done {
      border-color: hsl(142 71% 45%);
      border-top-color: hsl(142 71% 45%);
      animation: none;
    }
    .spinner.error {
      border-color: #e53e3e;
      border-top-color: #e53e3e;
      animation: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="hsl(210 100% 50%)"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.66Z"/>
        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.66Z"/>
      </svg>
    </div>

    <h1>ILGC Research</h1>

    <div class="spinner" id="spinner"></div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <p class="status" id="statusText">Initialising…</p>

    <div class="btn-row">
      <button class="btn quit-btn" id="quitBtn" onclick="window.ilgc.quit()">
        Quit
      </button>
      <button class="btn debug-btn" id="debugBtnBig" onclick="openDebug()">
        View Logs
      </button>
    </div>

    <button class="debug-link" onclick="openDebug()">View service logs</button>
  </div>

  <script>
    const statusEl   = document.getElementById('statusText');
    const fillEl     = document.getElementById('progressFill');
    const spinnerEl  = document.getElementById('spinner');
    const quitBtn    = document.getElementById('quitBtn');
    const debugBtnBig = document.getElementById('debugBtnBig');

    function openDebug() {
      window.ilgc.openExternal('http://localhost:5002/api/health').catch(() => {});
      // Signal main process to open the debug window
      window.ilgc.openDebug && window.ilgc.openDebug();
    }

    window.ilgc.onStatus(({ message, progress }) => {
      statusEl.textContent = message;
      statusEl.title = message;

      if (progress !== null && progress !== undefined) {
        fillEl.style.width = `${progress}%`;
      }

      if (message.startsWith('Error:')) {
        spinnerEl.classList.add('error');
        quitBtn.classList.add('visible');
        debugBtnBig.classList.add('visible');
      }

      if (progress === 100) {
        spinnerEl.classList.add('done');
      }
    });
  </script>
</body>
</html>
