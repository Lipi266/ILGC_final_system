<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILGC — Debug Logs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #111;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      -webkit-app-region: drag;
      flex-wrap: wrap;
    }

    .toolbar h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid;
      flex-shrink: 0;
    }
    .badge.ok    { color: #4ade80; border-color: #4ade80; }
    .badge.error { color: #f87171; border-color: #f87171; }
    .badge.warn  { color: #fbbf24; border-color: #fbbf24; }

    button {
      -webkit-app-region: no-drag;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #ccc;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #3a3a3a; color: #fff; }
    button.active { border-color: #60a5fa; color: #60a5fa; }

    .spacer { flex: 1; }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 8px 14px 0;
      border-bottom: 1px solid #333;
      background: #1a1a1a;
      flex-wrap: wrap;
    }

    .tab {
      padding: 5px 14px;
      border-radius: 6px 6px 0 0;
      border: 1px solid transparent;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      border-bottom: none;
    }
    .tab:hover { color: #ccc; }
    .tab.active {
      background: #111;
      border-color: #333;
      border-bottom-color: #111;
      color: #fff;
    }

    .panel {
      display: none;
      height: calc(100vh - 96px);
      overflow: auto;
      padding: 10px 14px;
      background: #111;
    }
    .panel.active { display: block; }

    pre {
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      color: #ccc;
    }

    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      padding: 4px 0;
    }

    .health-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .health-card h3 {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .health-card .value {
      font-family: monospace;
      font-size: 12px;
      color: #e0e0e0;
      word-break: break-all;
    }
    .health-card.ok    { border-left: 3px solid #4ade80; }
    .health-card.error { border-left: 3px solid #f87171; }

    .refresh-hint {
      font-size: 11px;
      color: #555;
      padding: 4px 0 8px;
    }

    /* colour-code log lines */
    .line-error { color: #f87171; }
    .line-warn  { color: #fbbf24; }
    .line-ok    { color: #4ade80; }
    .line-info  { color: #93c5fd; }
  </style>
</head>
<body>

<div class="toolbar">
  <h1>🔍 ILGC Debug</h1>
  <span class="badge warn" id="api-badge">API: checking…</span>
  <div class="spacer"></div>
  <button onclick="refreshAll()">↻ Refresh all</button>
  <button onclick="window.ilgc.quit()">✕ Quit</button>
</div>

<div class="tabs" id="tabs"></div>

<div id="panels"></div>

<script>
  const AUTO_REFRESH_MS = 5000;

  let logNames = [];
  let currentTab = 'health';

  // ── Build tabs ──────────────────────────────────────────────
  async function init() {
    logNames = await window.ilgc.getLogNames();

    const tabBar = document.getElementById('tabs');
    const panelsEl = document.getElementById('panels');

    // Health tab
    addTab(tabBar, panelsEl, 'health', 'Health Check');

    // One tab per log file
    for (const name of logNames) {
      addTab(tabBar, panelsEl, name, name.replace('_', ' '));
    }

    activateTab(currentTab);
    await refreshAll();
    setInterval(refreshAll, AUTO_REFRESH_MS);
  }

  function addTab(tabBar, panelsEl, id, label) {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.id = `tab-${id}`;
    tab.textContent = label;
    tab.onclick = () => activateTab(id);
    tabBar.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = `panel-${id}`;
    panelsEl.appendChild(panel);
  }

  function activateTab(id) {
    currentTab = id;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === `tab-${id}`));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${id}`));
  }

  // ── Refresh ─────────────────────────────────────────────────
  async function refreshAll() {
    await refreshHealth();
    if (currentTab !== 'health') {
      await refreshLog(currentTab);
    }
  }

  async function refreshHealth() {
    const panel = document.getElementById('panel-health');
    const badge = document.getElementById('api-badge');

    const result = await window.ilgc.getHealth();

    if (result.ok) {
      badge.textContent = 'API: ✓ online';
      badge.className = 'badge ok';

      const d = result.data || {};
      const rows = [
        { label: 'Status',          value: d.status || '—' },
        { label: 'Platform',        value: d.platform || '—' },
        { label: 'Platform version',value: d.platform_version || '—' },
        { label: 'Python version',  value: d.python_version || '—' },
        { label: 'Python exe',      value: d.python_executable || '—' },
        { label: 'Script path',     value: d.script_path || '—' },
        { label: 'Script exists',   value: String(d.script_exists) },
        { label: 'Timestamp',       value: d.timestamp || '—' },
      ];

      panel.innerHTML = `
        <p class="refresh-hint">Auto-refreshes every ${AUTO_REFRESH_MS / 1000}s</p>
        <div class="health-grid">
          ${rows.map(r => `
            <div class="health-card ok">
              <h3>${r.label}</h3>
              <div class="value">${r.value}</div>
            </div>
          `).join('')}
        </div>
      `;
    } else {
      badge.textContent = 'API: ✗ offline';
      badge.className = 'badge error';

      panel.innerHTML = `
        <p class="refresh-hint">Auto-refreshes every ${AUTO_REFRESH_MS / 1000}s</p>
        <div class="health-grid">
          <div class="health-card error">
            <h3>API unreachable</h3>
            <div class="value">${result.error || 'unknown error'}</div>
          </div>
          <div class="health-card error">
            <h3>What to check</h3>
            <div class="value">
              • Is api_server.py running?<br>
              • Check the api_server log tab<br>
              • Mac: port 5002 &nbsp; Win: port 5000
            </div>
          </div>
        </div>
      `;
    }
  }

  async function refreshLog(name) {
    const panel = document.getElementById(`panel-${name}`);
    if (!panel) return;

    const raw = await window.ilgc.getLog(name);
    panel.innerHTML = `
      <p class="refresh-hint">Showing last 200 lines · auto-refreshes every ${AUTO_REFRESH_MS / 1000}s</p>
      <pre>${colourize(escapeHtml(raw))}</pre>
    `;
    // Scroll to bottom
    panel.scrollTop = panel.scrollHeight;
  }

  // ── Tab switch triggers an immediate log refresh ─────────────
  const origActivate = activateTab;
  window.activateTab = (id) => {
    origActivate(id);
    if (id !== 'health') refreshLog(id);
  };

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function colourize(text) {
    return text.split('\n').map(line => {
      const l = line.toLowerCase();
      if (/error|traceback|exception|failed|cannot|refused/.test(l)) return `<span class="line-error">${line}</span>`;
      if (/warn|warning/.test(l))  return `<span class="line-warn">${line}</span>`;
      if (/\[ilgc-ok\]|started|ready|complete|success/.test(l)) return `<span class="line-ok">${line}</span>`;
      if (/\[ilgc\]|info/.test(l)) return `<span class="line-info">${line}</span>`;
      return line;
    }).join('\n');
  }

  // Override tab click to also refresh log
  function activateTab(id) {
    currentTab = id;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === `tab-${id}`));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${id}`));
    if (id !== 'health') refreshLog(id);
    else refreshHealth();
  }

  init();
</script>
</body>
</html>
